spring.application.name=api

# Actuator
management.endpoints.web.exposure.include=health,info
management.info.git.mode=simple
management.endpoint.health.show-details=never
management.server.port=8081
management.server.address=127.0.0.1

# Hikari
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000

# Mybatis
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=com.sele906.chaekeodi
mybatis.configuration.map-underscore-to-camel-case=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Library Data
library.api.base-url=https://data4library.kr
library.api.auth-key=${LIB_API_KEY}

# Kakao Map
kakao.api.auth-key=${KAKAO_API_KEY}

# Juso Map
juso.api.addr-key=${JUSO_API_KEY}
juso.api.coord-key=${COORD_API_KEY}

# Cookie
app.cookie.secure: true