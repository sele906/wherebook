# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Library Data (WireMock)
library.api.base-url=http://wiremock:8080/api
library.api.auth-key=${LIB_API_KEY}

# Kakao Map
kakao.api.auth-key=${KAKAO_API_KEY}

# Juso Map
juso.api.addr-key=${JUSO_API_KEY}
juso.api.coord-key=${COORD_API_KEY}

management.endpoints.web.exposure.include=health,info,librarysync,threaddump
management.server.port=8081
management.server.address=0.0.0.0